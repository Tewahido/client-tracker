# Deploys main to the server, only when someone starts it: the Actions tab's
# "Run workflow" button, or `gh workflow run deploy.yml`. Setup: "Deploying" in README.md.
#
# Two jobs, so secrets never share a machine with installed packages or the test suite:
#   build   no secrets: installs, runs every check, builds, and hands over dist/
#   deploy  the production environment's secrets, but no npm packages: uploads dist/
#
# GitHub runs this file from whichever branch someone picks, so the production
# environment must only allow main (Settings → Environments → production → Deployment
# branches). The checks below are a second line, not the protection.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a second one waits rather than racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run every check (typecheck, lint, tests, audit, build, end-to-end)
        run: npm run verify

      - name: Hand the build to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the "production" environment, so only this job can read them.
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      # Only for scripts/deploy.mjs, which uses nothing but Node's built-in modules.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Strip Windows line endings in case the key was pasted from a PC.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: refuse to talk to anything pretending to be the server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: node scripts/deploy.mjs --skip-checks
