# Deploys main to the server, only when someone starts it: the Actions tab's
# "Run workflow" button, or `gh workflow run deploy.yml`. Setup: "Deploying" in README.md.
#
#   Checks ──┐
#            ├──▶ Deploy (waits for approval)
#   Build  ──┘
#
# Checks and Build run side by side and need no secrets; Deploy starts only when both
# pass. Secrets never share a machine with installed packages: Deploy runs no npm
# packages, it only uploads the build.
#
# GitHub runs this file from whichever branch someone picks, so the production
# environment must only allow main (Settings → Environments → production → Deployment
# branches). The `if:` lines are a second line, not the protection.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a second one waits rather than racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history, to compare with the commit that's live now.
          fetch-depth: 0
          persist-credentials: false

      # Shown on the run before anyone approves: migrations must be applied by hand first
      # (the workflow has no database credentials, on purpose). Never fails the run.
      - name: Database changes since the live version
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          live=""
          if [ -n "$DEPLOY_URL" ]; then
            live=$(curl -fsS --max-time 10 "$DEPLOY_URL/version.json" 2>/dev/null | sed -n 's/.*"commit": *"\([0-9a-f]\{40\}\)".*/\1/p' || true)
          fi
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "::warning title=Database changes::Couldn't tell which version is live, so check for unapplied migrations yourself (npx supabase db push --linked --dry-run)."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$live" HEAD -- supabase/migrations)
          if [ -z "$added" ]; then
            echo "No new database migrations since the live version (${live:0:7})."
            exit 0
          fi
          echo "::warning title=Apply database migrations before approving::$(echo "$added" | xargs -n1 basename | paste -sd ',' - | sed 's/,/, /g') (run npx supabase db push --linked)"
          {
            echo "### Database migrations to apply before approving"
            echo
            echo "$added" | sed 's/^/- /'
            echo
            echo 'Apply them with `npx supabase db push --linked` first, then approve the deploy.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests required
        run: npm run check:tests

      - name: Unit and database tests
        run: npm test

      - name: Dependency audit
        run: npm run audit:prod

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Screenshots and traces of what went wrong, downloadable from the run page.
      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Public settings, built into the app. Repository-level variables: this job has no
    # environment, so it can't (and shouldn't) see the production environment's values.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the Supabase settings are set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY as repository variables (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Build the app
        run: npm run build

      - name: Hand the build to Deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: [checks, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the "production" environment, so only this job can read them.
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      # Only for scripts/deploy.mjs, which uses nothing but Node's built-in modules.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Strip Windows line endings in case the key was pasted from a PC.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: refuse to talk to anything pretending to be the server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Upload to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: node scripts/deploy.mjs --skip-checks

      - name: Summary
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          {
            echo "### Deployed $(git log -1 --format='%h: %s')"
            echo
            echo "- Live at ${DEPLOY_URL:-the server}"
            echo '- Undo it from a PC on main: `npm run deploy -- --rollback`'
          } >> "$GITHUB_STEP_SUMMARY"
