# Deploys main to the server, only when someone starts it: the Actions tab's
# "Run workflow" button, or `gh workflow run deploy.yml`. Every check runs first and the
# deploy stops at the first failure. Setup and secrets: "Deploying" in README.md.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a second one waits rather than racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets live in the "production" environment, so only this job can read them.
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # The tests-required check compares with main's history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Check database migrations are applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Skipped: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to check migrations before deploying."
            exit 0
          fi
          project_ref=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          npx --yes supabase@2.122.0 link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          result=$(npx --yes supabase@2.122.0 db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1)
          echo "$result"
          if printf '%s' "$result" | grep -q "Would push these migrations"; then
            echo "::error::main has database migrations that aren't applied yet. Apply them (npx supabase db push --linked), then run this again."
            exit 1
          fi

      - name: Run every check (typecheck, lint, tests, audit, build, end-to-end)
        run: npm run verify

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: refuse to talk to anything pretending to be the server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: node scripts/deploy.mjs --skip-checks
